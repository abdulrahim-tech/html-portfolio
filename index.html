<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rahim's Portfolio</title>

    <meta name="description"
        content="Rahim's SEO portfolio showcasing experience in content SEO, technical SEO, keyword research, and SEO strategy.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 30px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 14px;
            color: #d32f2f;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }

        .profile-image {
            width: 260px;
            height: 260px;
            object-fit: cover;
            border-radius: 50%;
            margin: 20px 0 30px;
        }

        .links {
            margin-top: 30px;
        }

        .links a {
            display: inline-block;
            margin: 10px;
            padding: 12px 24px;
            background-color: #222;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.3s;
        }

        .links a:hover {
            background-color: #555;
        }

        .about-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #222;
            text-decoration: none;
        }

        .about-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Rahim's Portfolio</h1>

        <h2>CONFIDENTIAL DOCUMENT - DO NOT SHARE</h2>

        <a class="about-link" href="./public/about.html">
            <h3>About Me</h3>
        </a>

        <img
            class="profile-image"
            src="./assets/images/image.png"
            alt="Rahim's profile photo"
        >

        <div class="links">
            <a href="./public/contact.html">Get in Touch</a>
        </div>

    </div>

</body>

</html>
